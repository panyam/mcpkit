# mcpkit-local conformance suites manifest.
#
# Joined by tools/conformance-report at render time with the upstream
# tier-check + traceability output. Adding an entry here surfaces it in
# the "mcpkit-local Conformance Suites" section of CONFORMANCE.md.
#
# Schema:
#   suites:
#     - suite:       <make target name, e.g. testconf-skills>
#       sep:         <one-line description used as the "Covers" column>
#       stage:       <testall stage label, e.g. 8h. Use - for suites not in testall.>
#       status:      <PASS | FAIL | INFO | SKIP>
#       source:      <where the scenarios live>
#         repo:           <e.g. panyam/mcpconformance, modelcontextprotocol/conformance>
#         branch:         <fork branch or upstream branch, e.g. feat/tasks-mrtr-extension>
#         path_var:       <MCPCONFORMANCE_*_PATH env var the testconf-* target reads>
#         default_path:   <where it defaults to, relative to repo root, e.g. ../conf-main>
#       note:        <one-line context, used as a footnote when set>
#       tracking:    <plain-text issue/PR ref, e.g. "mcpkit 567". Optional.>
#
# Drift-checked against conformance/Makefile by scripts/check-local-suites.sh.
# CI fails if a testconf-* target exists in the Makefile but is missing here
# (or vice versa), or if the stage label disagrees with the testall wiring.
#
# Status semantics:
#   PASS  — suite runs green today
#   FAIL  — suite runs and has known failures that block the umbrella
#   INFO  — suite runs (or fails-fast) and is wired through run_stage_info
#           in testall so it does not count toward PASS/FAIL totals
#   SKIP  — suite intentionally not run in this revision; explain why in note

suites:
  - suite: testconf-scope-challenge
    sep: SEP-2350 server-side scope challenges
    stage: '-'
    status: INFO
    source:
      repo: modelcontextprotocol/conformance
      branch: pull/481/head
      path_var: MCPCONFORMANCE_SCOPE_CHALLENGE_PATH
      default_path: ../conf-481
    note: >-
      17 pass / 0 fail / 0 warn / 0 skip as of 2026-09-03 against ccb0744
      (hand-recorded from the target's own summary line, so re-run
      testconf-scope-challenge before trusting it). Tracks an unmerged upstream
      PR, so a red run means the fixture contract moved rather than mcpkit
      regressing. Retarget to upstream main and flip to a hard gate once 481
      lands. Drives examples/auth/conformance-scope-challenge over opaque tokens
      with no authorization server; the real-IdP counterpart is
      testconf-auth-server.
    tracking: "conformance 481"
  - suite: testconf-tasks-v2
    sep: SEP-2663 Tasks v2
    stage: 8d
    status: PASS
    source:
      repo: modelcontextprotocol/conformance
      branch: main
      path_var: MCPCONFORMANCE_TASKS_V2_PATH
      default_path: ../conf-upstream-main
    note: >-
      44 pass / 0 fail / 1 skip across all 10 upstream tasks-* scenarios,
      against examples/tasks-v2 at upstream a983ba9. Until 2026-09-07 this
      target set TASKS_SERVER_URL / TASKS_SERVER_CMD and ran upstream's
      all-scenarios.test.ts, which reads neither var and spawns its own
      everything-server.ts, so it graded the TypeScript reference server and
      never touched mcpkit. Now CLI-driven per scenario, gated on zero FAILURE.

  - suite: testconf-mrtr
    sep: SEP-2322 MRTR
    stage: 8e
    status: PASS
    source:
      repo: modelcontextprotocol/conformance
      branch: main
      path_var: MCPCONFORMANCE_MRTR_PATH
      default_path: ../conf-upstream-main
    note: >-
      36 pass / 0 fail / 1 warn across all 14 upstream input-required-result-*
      scenarios, against cmd/testserver at upstream a983ba9. The fixture is
      cmd/testserver, not examples/mrtr: the scenarios call
      test_input_required_result_* tools that only
      cmd/testserver/conformance_input_required.go registers. Same dead-env-var
      history as testconf-tasks-v2 (MRTR_SERVER_URL / MRTR_SERVER_CMD were read
      by nothing upstream). Upstream's negative-mrtr suite still runs after the
      gate; it spawns its own broken fixture and grades the harness, not mcpkit.

  - suite: testconf-file-inputs
    sep: SEP-2356 File inputs (withdrawn upstream)
    stage: 8f
    status: PASS
    tracking: "mcpkit 827"
    source:
      repo: panyam/mcpconformance
      branch: pending
      path_var: MCPCONFORMANCE_FILE_INPUTS_PATH
      default_path: ../conf-pending

  - suite: testconf-auth-server
    sep: MCP authz 2025-11-25
    stage: 8g
    status: PASS
    source:
      repo: panyam/mcpconformance
      branch: pending
      path_var: MCPCONFORMANCE_AUTH_PATH
      default_path: ../conf-pending

  - suite: testconf-client
    sep: Client core + auth (full suite)
    stage: "-"
    status: PASS
    source:
      repo: modelcontextprotocol/conformance
      branch: main
      path_var: MCPCONFORMANCE_CLIENT_PATH
      default_path: ../conf-upstream-main
    note: "Same scenario set tier-check's --client-cmd runs. Expected failures (extension + draft + backcompat categories, none tier-scored) live in conformance/baseline.yml."

  - suite: testconf-stateless
    sep: SEP-2575 Stateless wire
    stage: "-"
    status: PASS
    source:
      repo: modelcontextprotocol/conformance
      branch: main
      path_var: MCPCONFORMANCE_STATELESS_PATH
      default_path: ../conf-upstream-main
    note: "30/30 as of upstream 0.2.0-alpha.9 (#376 fixed the former array-vs-object requiredCapabilities test)."

  - suite: testconf-skills
    sep: SEP-2640 Skills
    stage: 8h
    status: PASS
    source:
      repo: modelcontextprotocol/conformance
      branch: main
      path_var: MCPCONFORMANCE_SKILLS_PATH
      default_path: ../conf-upstream-main
    note: >-
      45 pass / 0 fail / 0 warn across the three upstream server scenarios
      (enumeration 32, manifest 6, directory 7), against examples/skills at
      upstream 7169291. Retargeted from the panyam/mcpconformance fork branch
      chore/sep-2640-yaml once PR 330 merged to upstream main; the scenario
      names did not change, so the move was a path swap. Gating since the
      retarget — it was INFO only because the fork branch was mid-WG-iteration.
      Upstream also registers five client-side skills scenarios
      (sep-2640-client-no-prefetch, sep-2640-client-verify-{digest,size,frontmatter})
      that this target does not run.

  - suite: testconf-events
    sep: SEP-3415 Events (draft)
    stage: 8i
    status: INFO
    source:
      repo: panyam/mcpconformance
      branch: feat/events-conformance-suite
      path_var: MCPCONFORMANCE_EVENTS_PATH
      default_path: ../conf-events
    note: >-
      116 pass / 1 fail / 13 warn across five scenarios,
      measured 2026-10-15
      against examples/events/kitchen-sink at the 1505 branch with the fork at
      ce9f93f (hand-recorded from the runner's own summaries, so re-run before
      trusting it): events-discovery
      13/13, events-poll 31/31, events-push
      21/21, events-webhook 28/29, events-webhook-delivery 23/23. The fixture is
      spawned with --conformance-events, which registers thirteen diagnostic
      controls the scenarios drive, including a restart that rebuilds the
      server over the same subscription store and one that permits the
      harness's loopback receiver past the callback guards after the SSRF rows
      are graded; without them rows describe conditions a harness cannot
      provoke and report untestable, which upstream's policy renders red. See
      examples/CONVENTIONS.md § Conformance fixtures.
      Proposed upstream as a draft in modelcontextprotocol/conformance 521 and
      tracked on the fork branch until it lands. Check IDs are sep-3415-*:
      MCP Events is SEP-3415, a draft in modelcontextprotocol/modelcontextprotocol.
      Every row quotes SEP-3415 at c47fd245 with a per-row section url (1502).
      INFO because the SEP is still a draft and its text can move. The one remaining red row,
      subscribe-auth-required, is untestable rather than a defect: the harness
      holds one credential for a run and kitchen-sink sets
      UnsafeAnonymousPrincipal by design. Thirteen divergences found in total,
      all closed (1379, 1381, 1416, 1432, 1433, 1434, and endpoint verification
      in 1444). Set tracked in 1425.
    tracking: "mcpkit 1374"

  - suite: testconf-events-client
    sep: SEP-3415 Events, client scenarios (draft)
    stage: 8j
    status: INFO
    source:
      repo: panyam/mcpconformance
      branch: feat/events-client-conformance
      path_var: MCPCONFORMANCE_EVENTS_CLIENT_PATH
      default_path: ../conf-events-client
    note: >-
      Four client scenarios graded against the Go events client SDK through
      experimental/ext/events/clients/go/cmd/conformance-client, measured
      2026-10-15, on both lifecycles: events-client-poll 8/8 on 2026-07-28
      (list_changed over subscriptions/listen since 1505) and 7/7 on 2025-11-25
      (the listen opt-in row does not apply there), events-client-push 2/2
      (dead-stream reconnect since 1503), events-client-webhook 2/2,
      events-client-no-extension 1/1. The harness plays the events server and
      grades what the client sends. The driver only calls what the SDK offers,
      so a red row is an SDK gap. Proposed upstream as a draft in
      modelcontextprotocol/conformance 541, stacked on 521. Re-measured
      2026-10-14 after the rows were re-quoted against SEP-3415 (1502), with
      the same results. INFO for the same reason as testconf-events: the SEP
      is still a draft. `make conf-events-setup`
      creates this checkout as a worktree of the server one.
    tracking: "mcpkit 1500"
