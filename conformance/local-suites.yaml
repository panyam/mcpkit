  - suite: testconf-events
    sep: SEP-3415 Events (draft)
    stage: 8i
    status: INFO
    source:
      repo: panyam/mcpconformance
      branch: feat/events-conformance-suite
      path_var: MCPCONFORMANCE_EVENTS_PATH
      default_path: ../conf-events
    note: >-
      129 pass / 0 fail / 11 warn across five scenarios, measured 2026-10-20
      against examples/events/kitchen-sink at 1570 with the fork at 23c7c2d
      (hand-recorded from the runner's own summaries, so re-run before
      trusting it): events-discovery 14/14, events-poll 33/33, events-push
      28/28, events-webhook 30/30, events-webhook-delivery 24/24. The three
      Mcp-Name rows (missing, mismatch, list exempt) came in with the re-pin
      to 2ec39b9c and were red until 1570. Since 1529
      the cross-tenant row unsubscribes by key, the 410 row also grades that
      the subscription survives, and lastError is graded off a refresh after
      the 413 probe; since 1505 discovery grades list-changed-notification
      over subscriptions/listen, driving the catalog control; since 1417 push
      grades stream-mode-unsupported on digest.ready, a poll-only type; since
      1465 push grades the four removal and schema-change rows through the
      catalog control's remove, retype and extend. kitchen-sink passes all of
      them. The fixture is
      spawned with --conformance-events, which registers thirteen diagnostic
      controls the scenarios drive, including a restart that rebuilds the
      server over the same subscription store and one that permits the
      harness's loopback receiver past the callback guards after the SSRF rows
      are graded; without them rows describe conditions a harness cannot
      provoke and report untestable, which upstream's policy renders red. See
      examples/CONVENTIONS.md § Conformance fixtures.
      Proposed upstream as a draft in modelcontextprotocol/conformance 521 and
      tracked on the fork branch until it lands. Check IDs are sep-3415-*:
      MCP Events is SEP-3415, a draft in modelcontextprotocol/modelcontextprotocol.
      Every row quotes SEP-3415 at 2ec39b9c with a per-row section url (1502, 1567).
      INFO because the SEP is still a draft and its text can move. Every graded
      row is green since 1570; subscribe-auth-required and
      subscribe-refresh-replaces-secret, which no harness can grade over the
      wire, are excluded upstream. Thirteen divergences found in total,
      all closed (1379, 1381, 1416, 1432, 1433, 1434, and endpoint verification
      in 1444). Set tracked in 1425.
    tracking: "mcpkit 1374"

  - suite: testconf-events-client
    sep: SEP-3415 Events, client scenarios (draft)
    stage: 8j
    status: INFO
    source:
      repo: panyam/mcpconformance
      branch: feat/events-client-conformance
      path_var: MCPCONFORMANCE_EVENTS_CLIENT_PATH
      default_path: ../conf-events-client
    note: >-
      Four client scenarios graded against the Go events client SDK through
      experimental/ext/events/clients/go/cmd/conformance-client, measured
      2026-10-20 at 1570 with the fork at 095a156, on both lifecycles:
      events-client-poll 10/10 on 2026-07-28 (list_changed over
      subscriptions/listen since 1505, Mcp-Name set and Base64-encoded since
      1570) and 7/7 on 2025-11-25 (the listen opt-in and Mcp-Name rows do not
      apply there), events-client-push 3/3 (dead-stream reconnect since 1503),
      events-client-webhook 3/3, events-client-no-extension 1/1. The harness plays the events server and
      grades what the client sends. The driver only calls what the SDK offers,
      so a red row is an SDK gap. Proposed upstream as a draft in
      modelcontextprotocol/conformance 541, stacked on 521. Re-measured
      2026-10-14 after the rows were re-quoted against SEP-3415 (1502), with
      the same results. INFO for the same reason as testconf-events: the SEP
      is still a draft. `make conf-events-setup`
      creates this checkout as a worktree of the server one.
    tracking: "mcpkit 1500"

  - suite: testconf-agents
    sep: Agent discovery, agents-wg#22 (draft, placeholder sep-9998)
    stage: 8k
    status: INFO
    source:
      repo: panyam/mcpconformance
      branch: feat/agents-conformance-suite
      path_var: MCPCONFORMANCE_AGENTS_PATH
      default_path: ../conf-agents
    note: >-
      Two scenarios, measured 2026-10-15 against examples/agents/discovery
      --conformance-agents with the fork at 4661c43: sep-9998-agents-discovery
      28/28 and sep-9998-agents-list-changed 4/4. Rows quote agents-wg#22 at
      9b16840e, checked by script. The yaml declares 49 rows, 31 graded and 18
      excluded (host obligations, rules needing two authorization contexts,
      and step-up, a MAY needing a credential the harness can raise). Breaking
      the fixture turns the matching rows red: a visible hidden agent fails two
      discovery rows, an unsent list_changed fails one list-changed row, a wrong
      agent_not_found reason fails one, and an omitted ttlMs fails two, since
      the draft CacheableResult requires it. The fixture flag serves
      anonymously, pages one agent at a time, adds an agent naming a missing
      tool, and registers agents_conformance_fixture and
      agents_conformance_add_agent (see examples/CONVENTIONS.md § Conformance
      fixtures). Check IDs carry the sep-9998 placeholder because the SEP lives
      in the Agents WG repository and has no spec PR number yet. INFO for that
      reason and because the SEP is a draft. Runs with --force, since the
      extension is not on the spec timeline. Proposed upstream as a draft,
      modelcontextprotocol/conformance 556, held in draft until the issue
      AGENTS.md asks for is opened after the Agents WG vote on 2026-10-16.
    tracking: "mcpkit 1393"
