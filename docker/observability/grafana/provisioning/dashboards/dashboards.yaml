# Grafana dashboard provisioning. Dashboards land alongside the
# OTel work that produces the data they visualize; each drops a JSON
# under ./files/ for Grafana to pick up automatically on next restart.
# Present: mcpkit-overview (server dispatch metrics), mcpkit-agent
# (agent Runner metrics, issue 1023). Still to come: the P6 surface
# dashboards (ext/auth / ext/tasks / ext/ui / server reverse-call).

apiVersion: 1

providers:
  - name: mcpkit
    orgId: 1
    folder: ""
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    allowUiUpdates: true
    options:
      path: /etc/grafana/provisioning/dashboards/files
      foldersFromFilesStructure: true
