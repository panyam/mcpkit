# massrelay and servicekit-client are ours, and this package bumps them right
# after their releases, so both are exempt from the one-day release-age
# policy. servicekit-client used to be pinned to the one version that needed
# it; each massrelay release moves it, so the pin needed rewriting every time
# (0.1.9, then 0.1.11). Nothing else is exempt.
minimumReleaseAgeExclude:
  - "@panyam/massrelay"
  - "@panyam/servicekit-client"
