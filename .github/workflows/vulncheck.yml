name: Vulncheck

# Deliberately NOT on pull_request or push-to-main.
#
# govulncheck's signal is reachability against an advisory database that moves
# independently of this repo: a CVE published on Tuesday affects code pushed on
# Monday. Any activity-triggered scan structurally misses that case, which is the
# dominant one. (The four advisories fixed in PR 1222 were all reachable from
# code that had not changed since v0.4.0 shipped; the database caught up to it.)
# So the trigger is time, plus the release gate.
#
# `make vulncheck`, not `just`: make is preinstalled on ubuntu-latest, and the
# recipe is mirrored in both files.
on:
  schedule:
    # Mondays 06:30 UTC, staggered off scorecard.yml's 02:30 Monday slot.
    - cron: '30 6 * * 1'
  push:
    # A second pass at release time, on top of the schedule above.
    #
    # This leg was dead from v0.4.0 through v0.6.0 and nobody noticed, because
    # `make tag-push` sent 20 refs in one push and GitHub raises no push event
    # for a tag push that large. Every release in that window was covered by
    # the weekly schedule alone (#1412). #1411 split the push; `make
    # check-release-workflows V=<tag>` is what confirms this fired.
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  vulncheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # A tag points at the stripped-replaces commit, and restoring needs
          # its parent.
          fetch-depth: 2

      # On a tag, put the in-repo replaces back (#1488), so each module is
      # scanned against the tree it was tagged with rather than fetching its
      # siblings at a version the proxy may not serve yet. Anywhere else this
      # is a no-op.
      - name: Restore in-repo replaces
        run: bash scripts/release-replaces.sh restore

      # The action runs the scan and files an issue when it fails, since a red
      # X in the Actions tab is invisible and GitHub's notification for
      # scheduled-workflow failures is unreliable. An open issue whose title
      # starts with "vulncheck:" gets a comment instead of a second issue.
      #
      # The labels are applied here rather than left to triage-label.yml: GitHub
      # does not trigger workflows from events created with GITHUB_TOKEN, so that
      # workflow will not fire for a bot-filed issue. An unlabelled auto-issue
      # would erode the SEP-1730 triage metric, which counts the share of open
      # issues carrying at least one label.
      #
      # scripts/vulncheck-all.sh wants govulncheck on the PATH, so the command
      # installs a pinned one first.
      - uses: panyam/ci-actions/vulncheck@v0.1.2
        with:
          command: go install golang.org/x/vuln/cmd/govulncheck@v1.10.0 && make vulncheck
          labels: security,P1
