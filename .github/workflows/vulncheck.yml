name: Vulncheck

# Deliberately NOT on pull_request or push-to-main.
#
# govulncheck's signal is reachability against an advisory database that moves
# independently of this repo: a CVE published on Tuesday affects code pushed on
# Monday. Any activity-triggered scan structurally misses that case, which is the
# dominant one. (The four advisories fixed in PR 1222 were all reachable from
# code that had not changed since v0.4.0 shipped; the database caught up to it.)
# So the trigger is time, plus the release gate.
#
# `make vulncheck`, not `just`: make is preinstalled on ubuntu-latest, and the
# recipe is mirrored in both files.
on:
  schedule:
    # Mondays 06:30 UTC, staggered off scorecard.yml's 02:30 Monday slot.
    - cron: '30 6 * * 1'
  push:
    # DEPENDENCY_POLICY.md: the audit runs before every tagged release. This is
    # what makes that claim enforced rather than aspirational.
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  vulncheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest

      - name: Scan root + published sub-modules
        run: make vulncheck 2>&1 | tee scan.log

      # A red X in the Actions tab is invisible, and GitHub's notification for
      # scheduled-workflow failures is unreliable. File an issue instead.
      #
      # The labels are applied here rather than left to triage-label.yml: GitHub
      # does not trigger workflows from events created with GITHUB_TOKEN, so that
      # workflow will not fire for a bot-filed issue. An unlabelled auto-issue
      # would erode the SEP-1730 triage metric, which counts the share of open
      # issues carrying at least one label.
      - name: Report failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const log = fs.readFileSync('scan.log', 'utf8');
            const tail = log.length > 8000 ? log.slice(-8000) : log;
            const marker = 'security';
            const titlePrefix = 'vulncheck:';

            const { data: open } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: marker,
              per_page: 100,
            });
            const existing = open.find(i => i.title.startsWith(titlePrefix));

            const run = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = [
              `\`make vulncheck\` failed on the scheduled run (\`${context.sha.slice(0, 7)}\`).`,
              ``,
              `[Workflow run](${run})`,
              ``,
              '```',
              tail,
              '```',
            ].join('\n');

            // Dedupe: without this a fresh issue lands every Monday for the same
            // advisory until someone fixes it.
            if (existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body: `Still failing.\n\n${body}`,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: `${titlePrefix} advisories reachable in the published module surface`,
                labels: [marker, 'P1'],
                body,
              });
            }
