name: Keycloak Interop

# The 19 tests in tests/keycloak against a real Keycloak realm. They guard
# ext/auth on both wires, and #1567 broke the stateless step-up test with
# nothing going red, because this suite ran nowhere (#1597).
#
# A plain job rather than a service container: a service container can't be
# given a command, and the Keycloak image exits printing its usage unless it is
# told `start-dev`. scripts/keycloak-up.sh passes it, along with the realm.
# testkcl-auto sets KEYCLOAK_REQUIRED=1, so a Keycloak that never came up fails
# the job rather than passing it as skips.

on:
  pull_request:
    paths:
      - 'ext/auth/**'
      - 'client/**'
      - 'server/**'
      - 'core/**'
      - 'tests/keycloak/**'
      - 'scripts/keycloak-up.sh'
      - 'scripts/testkcl-auto.sh'
      - '.github/workflows/keycloak-interop.yml'
  push:
    branches: [main]
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  keycloak:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Keycloak interop tests
        run: make testkcl-auto
