# GENERATED by tools/gen-compose. DO NOT EDIT.
# Regenerate via `make gen-compose [N=<n>]`.
#
# events-stack.yaml — the whole-enchilada events demo as ONE self-contained
# compose file, for people who do not have the mcpkit repo.
#
#   curl -O https://raw.githubusercontent.com/panyam/mcpkit/main/examples/whole-enchilada/events/events-stack.yaml
#   docker compose -f events-stack.yaml up
#
# Nothing is built from source and nothing is bind-mounted from the repo:
# every image is pulled from GHCR or Docker Hub, the nginx config is inlined
# as a compose `config`, and state lives in named volumes. That is the whole
# difference from docker-compose.yaml in this directory, which is the
# development flow (`make up`) and builds the event-server from your checkout.
#
# Requires Compose v2.23+ for inline `configs:` content.
#
# What you get by default:
#   nginx (:9090) -> 3 round-robin event-server replicas
#   postgres      -> durable WebhookStore + EventBufferStore
#   redis         -> cross-replica event fanout + global subscription caps
#   auth          -> anonymous. Every caller is `demo-principal`.
#
# Add multi-tenant auth with the `auth` profile:
#   docker compose -f events-stack.yaml --profile auth up
# which starts Keycloak (:8180) with three realms and flips the replicas onto
# token introspection. Anonymous subscribes are then rejected per the spec.
#
# The interactive subscriber tools (`make webhook`, `make streamer`,
# `make poller`) are NOT here: they run on the host from a repo checkout.
# This file gives you a server to point your OWN MCP client at.

name: mcpkit-events

configs:
  nginx_conf:
    content: |
      # GENERATED by tools/gen-compose. DO NOT EDIT.
      # Regenerate via `make gen-compose [N=<n>]`.

      events {
          worker_connections 1024;
      }

      http {
          # Long timeouts on SSE / push streams; disable response buffering.
          proxy_read_timeout 3600s;
          proxy_buffering off;

          upstream event-server-pool {
              # Round-robin across replicas. The demo's clients run in
              # SEP-2575 stateless wire mode (client.ClientModeStateless),
              # so every request is self-contained and any replica can
              # serve it. No session-affinity needed.
              #
              # `resolve` (with the zone + resolver below) makes nginx
              # re-resolve each replica's container IP on a TTL instead of
              # caching it once at startup. Without it, restarting a replica
              # (Phase 3 kill/start, Phase 6b/8 tier restart) leaves nginx
              # dialing the dead IP — "connect() failed (113: Host is
              # unreachable)" until the connect times out. Needs nginx
              # >= 1.27.3; the image is pinned to nginx:1.27-alpine.
              zone event-server-pool 64k;
              resolver 127.0.0.11 ipv6=off valid=10s;
              server event-server-1:8080 resolve;
              server event-server-2:8080 resolve;
              server event-server-3:8080 resolve;
          }

          # Default server (catches localhost / 127.0.0.1 / any unknown Host):
          # routes to the event-server pool. The make walkthrough / make demo
          # path connects via http://localhost:9090 by default, so this is
          # what the walkthrough actually hits. The *.whole-enchilada hostnames
          # below give operators the in-network DNS aliases for the
          # `make hosts-install` flow.
          server {
              listen 80 default_server;

              # Dynamic-source admin API: /admin/replicas/{idx}/sources/... is
              # routed to event-server-{idx}:8080/admin/sources/... regardless
              # of round-robin. Lets the evctl CLI pin admin operations to
              # specific replicas without requiring /etc/hosts entries — the
              # operator hits http://localhost:9090 throughout the demo.
              location ~ ^/admin/replicas/(?<idx>\d+)(?<rest>/.*)$$ {
                  resolver 127.0.0.11 ipv6=off valid=10s;
                  set $$upstream "event-server-$$idx";
                  proxy_pass http://$$upstream:8080/admin$$rest;
                  proxy_http_version 1.1;
                  proxy_set_header Host $$host;
                  proxy_set_header Connection "";
              }

              location / {
                  proxy_pass http://event-server-pool;
                  proxy_http_version 1.1;
                  proxy_set_header Host $$host;
                  proxy_set_header Connection "";
              }
          }

          # event-server.whole-enchilada — round-robin pool.
          server {
              listen 80;
              server_name event-server.whole-enchilada;
              location / {
                  proxy_pass http://event-server-pool;
                  proxy_http_version 1.1;
                  proxy_set_header Host $$host;
                  proxy_set_header Connection "";
              }
          }

          # event-server-<i>.whole-enchilada — direct pin via regex capture.
          server {
              listen 80;
              server_name ~^event-server-(?<idx>\d+)\.whole-enchilada$$;
              resolver 127.0.0.11 ipv6=off valid=10s;
              location / {
                  set $$upstream "event-server-$$idx";
                  proxy_pass http://$$upstream:8080;
                  proxy_http_version 1.1;
                  proxy_set_header Host $$host;
                  proxy_set_header Connection "";
              }
          }
      }

volumes:
  postgres_data:
  redis_data:

services:
  nginx:
    image: nginx:1.27-alpine
    ports:
      - "9090:80"
    configs:
      - source: nginx_conf
        target: /etc/nginx/nginx.conf
    depends_on:
      - event-server-1
      - event-server-2
      - event-server-3
    networks:
      mcpkit:
        aliases:
          - nginx.whole-enchilada

  postgres:
    image: pgvector/pgvector:pg18
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: events
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d events"]
      interval: 3s
      timeout: 2s
      retries: 20
    volumes:
      - postgres_data:/var/lib/postgresql
    networks:
      mcpkit:
        aliases:
          - postgres

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--dir", "/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 1s
      retries: 10
    volumes:
      - redis_data:/data
    networks:
      mcpkit:
        aliases:
          - redis

  # Keycloak is opt-in. Without the `auth` profile the replicas leave
  # OAUTH_INTROSPECTION_URLS empty and fall back to an anonymous principal,
  # which is what makes `docker compose up` answer in seconds instead of
  # waiting ~30s on a realm import nobody asked for.
  keycloak:
    image: ghcr.io/panyam/mcpkit-events-keycloak:latest
    profiles: ["auth"]
    restart: unless-stopped
    command: ["start-dev", "--http-port=8080", "--import-realm"]
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_HTTP_RELATIVE_PATH: /
      KC_HOSTNAME: http://localhost:8180
      KC_HOSTNAME_STRICT: "false"
    ports:
      - "8180:8080"
    healthcheck:
      test:
        - CMD-SHELL
        - "exec 3<>/dev/tcp/localhost/8080 && printf 'GET /realms/camelot/.well-known/openid-configuration HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && head -c 64 <&3 | grep -q '200 OK'"
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s
    networks:
      mcpkit:
        aliases:
          - keycloak

  event-server-1:
    image: ghcr.io/panyam/mcpkit-event-server:latest
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      REPLICA_NAME: event-server-1
      EVENT_INJECT_BEARER: ${EVENT_INJECT_BEARER:-stage-1-shared-secret}
      POSTGRES_DSN: ${POSTGRES_DSN:-postgres://postgres:postgres@postgres:5432/events?sslmode=disable}
      REDIS_ADDR: ${REDIS_ADDR:-redis:6379}
      # Empty by default, which is what selects the anonymous posture. The
      # `auth` profile is enabled by setting this to the three realm
      # introspection endpoints:
      #   OAUTH_INTROSPECTION_URLS=http://keycloak:8080/realms/asgard/protocol/openid-connect/token/introspect,http://keycloak:8080/realms/babylon/protocol/openid-connect/token/introspect,http://keycloak:8080/realms/camelot/protocol/openid-connect/token/introspect
      OAUTH_INTROSPECTION_URLS: ${OAUTH_INTROSPECTION_URLS:-}
      OAUTH_CLIENT_ID: ${OAUTH_CLIENT_ID:-mcp-event-server}
      OAUTH_CLIENT_SECRET: ${OAUTH_CLIENT_SECRET:-mcpkit-demo-secret-DEMO-ONLY}
      OAUTH_CACHE_TTL: ${OAUTH_CACHE_TTL:-5s}
      OAUTH_ISSUER_BASE: ${OAUTH_ISSUER_BASE:-http://localhost:8180}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8080/healthz"]
      interval: 5s
      timeout: 2s
      retries: 5
    networks:
      mcpkit:
        aliases:
          - event-server-1.whole-enchilada

  event-server-2:
    image: ghcr.io/panyam/mcpkit-event-server:latest
    restart: unless-stopped
    # Replica 1 creates the schema on first boot. Concurrent AutoMigrate
    # from N replicas against an empty DB races on Postgres catalog creates
    # (pg_type, SQLSTATE 23505) and kills the losers, so 2..N wait for it.
    depends_on:
      event-server-1:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      REPLICA_NAME: event-server-2
      EVENT_INJECT_BEARER: ${EVENT_INJECT_BEARER:-stage-1-shared-secret}
      POSTGRES_DSN: ${POSTGRES_DSN:-postgres://postgres:postgres@postgres:5432/events?sslmode=disable}
      REDIS_ADDR: ${REDIS_ADDR:-redis:6379}
      # Empty by default, which is what selects the anonymous posture. The
      # `auth` profile is enabled by setting this to the three realm
      # introspection endpoints:
      #   OAUTH_INTROSPECTION_URLS=http://keycloak:8080/realms/asgard/protocol/openid-connect/token/introspect,http://keycloak:8080/realms/babylon/protocol/openid-connect/token/introspect,http://keycloak:8080/realms/camelot/protocol/openid-connect/token/introspect
      OAUTH_INTROSPECTION_URLS: ${OAUTH_INTROSPECTION_URLS:-}
      OAUTH_CLIENT_ID: ${OAUTH_CLIENT_ID:-mcp-event-server}
      OAUTH_CLIENT_SECRET: ${OAUTH_CLIENT_SECRET:-mcpkit-demo-secret-DEMO-ONLY}
      OAUTH_CACHE_TTL: ${OAUTH_CACHE_TTL:-5s}
      OAUTH_ISSUER_BASE: ${OAUTH_ISSUER_BASE:-http://localhost:8180}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8080/healthz"]
      interval: 5s
      timeout: 2s
      retries: 5
    networks:
      mcpkit:
        aliases:
          - event-server-2.whole-enchilada

  event-server-3:
    image: ghcr.io/panyam/mcpkit-event-server:latest
    restart: unless-stopped
    # Replica 1 creates the schema on first boot. Concurrent AutoMigrate
    # from N replicas against an empty DB races on Postgres catalog creates
    # (pg_type, SQLSTATE 23505) and kills the losers, so 2..N wait for it.
    depends_on:
      event-server-1:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      REPLICA_NAME: event-server-3
      EVENT_INJECT_BEARER: ${EVENT_INJECT_BEARER:-stage-1-shared-secret}
      POSTGRES_DSN: ${POSTGRES_DSN:-postgres://postgres:postgres@postgres:5432/events?sslmode=disable}
      REDIS_ADDR: ${REDIS_ADDR:-redis:6379}
      # Empty by default, which is what selects the anonymous posture. The
      # `auth` profile is enabled by setting this to the three realm
      # introspection endpoints:
      #   OAUTH_INTROSPECTION_URLS=http://keycloak:8080/realms/asgard/protocol/openid-connect/token/introspect,http://keycloak:8080/realms/babylon/protocol/openid-connect/token/introspect,http://keycloak:8080/realms/camelot/protocol/openid-connect/token/introspect
      OAUTH_INTROSPECTION_URLS: ${OAUTH_INTROSPECTION_URLS:-}
      OAUTH_CLIENT_ID: ${OAUTH_CLIENT_ID:-mcp-event-server}
      OAUTH_CLIENT_SECRET: ${OAUTH_CLIENT_SECRET:-mcpkit-demo-secret-DEMO-ONLY}
      OAUTH_CACHE_TTL: ${OAUTH_CACHE_TTL:-5s}
      OAUTH_ISSUER_BASE: ${OAUTH_ISSUER_BASE:-http://localhost:8180}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8080/healthz"]
      interval: 5s
      timeout: 2s
      retries: 5
    networks:
      mcpkit:
        aliases:
          - event-server-3.whole-enchilada

networks:
  mcpkit:
    driver: bridge
