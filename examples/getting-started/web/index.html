<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>mcpkit getting-started</title>
<link rel="icon" href="data:,">
<style>
  :root {
    --bg: #fafaf9; --fg: #1c1917; --muted: #78716c; --panel: #ffffff;
    --border: #e7e5e4; --accent: #2563eb; --out: #1d4ed8; --in: #047857; --err: #b91c1c;
    --code: #f5f5f4;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0c0a09; --fg: #e7e5e4; --muted: #a8a29e; --panel: #1c1917;
      --border: #292524; --accent: #60a5fa; --out: #93c5fd; --in: #6ee7b7; --err: #fca5a5;
      --code: #0c0a09;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg);
         font: 14px/1.5 system-ui, -apple-system, sans-serif; }
  main { max-width: 1100px; margin: 0 auto; padding: 24px 16px; }
  h1 { font-size: 20px; margin: 0 0 4px; }
  .sub { color: var(--muted); margin: 0 0 20px; }
  .grid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.3fr); gap: 16px; }
  @media (max-width: 760px) { .grid { grid-template-columns: minmax(0, 1fr); } }
  section { background: var(--panel); border: 1px solid var(--border); border-radius: 8px; padding: 16px; }
  h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); margin: 0 0 12px; }
  .status { font-size: 13px; color: var(--muted); margin-bottom: 12px; }
  .status.ok { color: var(--in); } .status.bad { color: var(--err); }
  .tool { border-top: 1px solid var(--border); padding-top: 12px; margin-top: 12px; }
  .tool:first-of-type { border-top: 0; padding-top: 0; margin-top: 0; }
  .tool b { font-family: ui-monospace, monospace; }
  .tool p { margin: 2px 0 8px; color: var(--muted); }
  label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 2px; }
  input, textarea { width: 100%; padding: 6px 8px; border: 1px solid var(--border); border-radius: 6px;
                    background: var(--code); color: var(--fg); font: 13px ui-monospace, monospace; }
  textarea { min-height: 90px; resize: vertical; }
  button { margin-top: 8px; padding: 6px 12px; border: 0; border-radius: 6px; background: var(--accent);
           color: #fff; font-weight: 600; cursor: pointer; }
  button:disabled { opacity: .5; cursor: default; }
  .result { margin-top: 8px; font-family: ui-monospace, monospace; white-space: pre-wrap; }
  #log { display: flex; flex-direction: column; gap: 8px; max-height: 70vh; overflow: auto; }
  .msg { border-left: 3px solid var(--border); padding-left: 8px; }
  .msg .dir { font-size: 12px; font-weight: 600; }
  .msg.out { border-color: var(--out); } .msg.out .dir { color: var(--out); }
  .msg.in { border-color: var(--in); } .msg.in .dir { color: var(--in); }
  .msg pre { margin: 2px 0 0; padding: 6px 8px; background: var(--code); border-radius: 4px;
             overflow-x: auto; font-size: 12px; }
  details { margin-top: 16px; }
  summary { cursor: pointer; color: var(--muted); }
</style>
</head>
<body>
<main>
  <h1>getting-started, running in your browser</h1>
  <p class="sub">The mcpkit server from <code>examples/getting-started/server</code>, compiled to WebAssembly.
    It runs in a Web Worker on this page. Nothing talks to a backend.</p>
  <div class="grid">
    <section>
      <h2>Tools</h2>
      <div id="status" class="status">Loading server.wasm…</div>
      <div id="tools"></div>
      <details>
        <summary>Send raw JSON-RPC</summary>
        <textarea id="raw">{"jsonrpc": "2.0", "id": 100, "method": "ping"}</textarea>
        <button id="sendRaw" disabled>Send</button>
      </details>
    </section>
    <section>
      <h2>Wire log</h2>
      <div id="log"></div>
    </section>
  </div>
</main>
<script>
const worker = new Worker("worker.js");
const logEl = document.getElementById("log");
const statusEl = document.getElementById("status");
const pending = new Map();
let nextId = 1;

function log(dir, text) {
  const div = document.createElement("div");
  div.className = "msg " + dir;
  let body = text;
  try { body = JSON.stringify(JSON.parse(text), null, 2); } catch {}
  div.innerHTML = '<div class="dir"></div><pre></pre>';
  div.querySelector(".dir").textContent = dir === "out" ? "→ page to server" : "← server to page";
  div.querySelector("pre").textContent = body;
  logEl.appendChild(div);
  logEl.scrollTop = logEl.scrollHeight;
}

function post(msg) {
  const text = JSON.stringify(msg);
  log("out", text);
  worker.postMessage(text);
}

function request(method, params) {
  const id = nextId++;
  post({ jsonrpc: "2.0", id, method, params });
  return new Promise((resolve, reject) => pending.set(id, { resolve, reject }));
}

worker.onmessage = (e) => {
  if (typeof e.data !== "string") {
    if (e.data.mcpkit === "ready") start();
    if (e.data.mcpkit === "error") setStatus("Failed to load: " + e.data.message, "bad");
    if (e.data.mcpkit === "exited") setStatus("The server exited.", "bad");
    return;
  }
  log("in", e.data);
  const msg = JSON.parse(e.data);
  const p = pending.get(msg.id);
  if (p && !msg.method) {
    pending.delete(msg.id);
    msg.error ? p.reject(msg.error) : p.resolve(msg.result);
  }
};

function setStatus(text, cls) {
  statusEl.textContent = text;
  statusEl.className = "status " + (cls || "");
}

async function start() {
  try {
    const init = await request("initialize", {
      protocolVersion: "2025-11-25",
      capabilities: {},
      clientInfo: { name: "mcpkit-web-inspector", version: "0.1.0" },
    });
    post({ jsonrpc: "2.0", method: "notifications/initialized" });
    setStatus("Connected to " + init.serverInfo.name + " " + init.serverInfo.version +
      ", protocol " + init.protocolVersion, "ok");
    document.getElementById("sendRaw").disabled = false;
    const { tools } = await request("tools/list", {});
    renderTools(tools);
  } catch (err) {
    setStatus("Handshake failed: " + JSON.stringify(err), "bad");
  }
}

function renderTools(tools) {
  const root = document.getElementById("tools");
  root.replaceChildren();
  for (const tool of tools) {
    const div = document.createElement("div");
    div.className = "tool";
    const props = (tool.inputSchema && tool.inputSchema.properties) || {};
    div.innerHTML = "<b></b><p></p><form></form><div class='result'></div>";
    div.querySelector("b").textContent = tool.name;
    div.querySelector("p").textContent = tool.description || "";
    const form = div.querySelector("form");
    for (const [name, schema] of Object.entries(props)) {
      const label = document.createElement("label");
      label.textContent = name + (schema.description ? " (" + schema.description + ")" : "");
      const input = document.createElement("input");
      input.name = name;
      input.value = name === "name" ? "world" : "";
      form.append(label, input);
    }
    const btn = document.createElement("button");
    btn.textContent = "Call " + tool.name;
    form.append(btn);
    form.onsubmit = async (e) => {
      e.preventDefault();
      const args = Object.fromEntries(new FormData(form));
      const out = div.querySelector(".result");
      try {
        const res = await request("tools/call", { name: tool.name, arguments: args });
        out.textContent = (res.content || []).map((c) => c.text ?? JSON.stringify(c)).join("\n");
      } catch (err) {
        out.textContent = "Error: " + JSON.stringify(err);
      }
    };
    root.appendChild(div);
  }
}

document.getElementById("sendRaw").onclick = () => {
  const text = document.getElementById("raw").value;
  try { JSON.parse(text); } catch (err) { alert("Not valid JSON: " + err.message); return; }
  log("out", text);
  worker.postMessage(text);
};
</script>
</body>
</html>
