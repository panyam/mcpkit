<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Tic-Tac-Toe</title>
  <style>
    * { box-sizing: border-box }
    body { margin: 0; font-family: system-ui; text-align: center; padding: 1em; background: var(--bg, #fff); color: var(--fg, #333) }
    h2 { margin: 0.5em 0 }
    #status { color: #666; margin-bottom: 0.5em; min-height: 1.5em }
    .board {
      display: inline-grid;
      grid-template-columns: repeat(3, 80px);
      grid-template-rows: repeat(3, 80px);
      gap: 4px;
      margin: 0.5em 0;
    }
    .cell {
      font-size: 2.5em;
      font-weight: bold;
      border: 2px solid #ccc;
      border-radius: 8px;
      background: #f9f9f9;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.1s;
    }
    .cell:hover { background: #eef }
    .cell.x { color: #e44; }
    .cell.o { color: #44e; }
    .cell.taken { cursor: default; }
    button {
      font-size: 1em;
      padding: 0.4em 1.5em;
      cursor: pointer;
      border-radius: 6px;
      border: 1px solid #ccc;
      background: #f5f5f5;
      margin-top: 0.5em;
    }
    button:hover { background: #e8e8e8 }
  </style>
</head>
<body>
{{ template "mcpkit-bridge" .Bridge }}
<h2>Tic-Tac-Toe</h2>
<p id="status">Connecting...</p>
<div class="board" id="board"></div>
<br>
<button onclick="newGame()">New Game</button>
<script>
  // Game state (mirrors server state, updated via tool results).
  var board = ['','','','','','','','',''];
  var currentTurn = 'X';
  var gameOver = false;

  function renderBoard() {
    var el = document.getElementById('board');
    // Clear board using safe DOM methods.
    while (el.firstChild) el.removeChild(el.firstChild);

    for (var i = 0; i < 9; i++) {
      var cell = document.createElement('div');
      cell.className = 'cell' + (board[i] ? ' taken ' + board[i].toLowerCase() : '');
      cell.textContent = board[i];
      cell.dataset.pos = i;
      if (!board[i] && !gameOver) {
        cell.onclick = function() { userMove(parseInt(this.dataset.pos)); };
      }
      el.appendChild(cell);
    }
  }

  function updateStatus(msg) {
    document.getElementById('status').textContent = msg;
  }

  // User clicks a cell — call the server_move tool to place their piece,
  // then tell the model it's its turn. Without the ui/message the model has
  // no idea the user moved and the game stalls.
  function userMove(pos) {
    if (board[pos] || gameOver || currentTurn !== 'X') return;
    updateStatus('Placing...');
    MCPApp.callTool('server_move', { position: pos }).then(function() {
      return syncFromServer();
    }).then(function(state) {
      if (!state || state.gameOver) return;
      updateStatus('Waiting for the model...');
      return MCPApp.sendMessage({
        role: 'user',
        content: [{ type: 'text', text:
          'I placed X at position ' + pos + '. Your turn: play O by calling server_move with a position 0-8.' }]
      }).then(waitForModelMove);
    }).catch(function(err) {
      updateStatus('Error: ' + err.message);
    });
  }

  // The model moves by calling server_move from the chat, and hosts only send
  // ui/notifications/tool-result for the call that opened this iframe, so the
  // app never hears about it. Poll until the turn comes back to X.
  var pollTimer = null;
  function waitForModelMove() {
    clearInterval(pollTimer);
    var tries = 0;
    pollTimer = setInterval(function() {
      if (++tries > 120) { clearInterval(pollTimer); updateStatus(currentTurn + "'s turn"); return; }
      syncFromServer().then(function(state) {
        if (state && (state.gameOver || state.turn === 'X')) clearInterval(pollTimer);
      });
    }, 1000);
  }

  // Sync game state from server. Resolves with the parsed state.
  function syncFromServer() {
    return MCPApp.callTool('get_game_state', {}).then(function(result) {
      var state = result && result.structuredContent;
      if (!state && result && result.content && result.content[0]) {
        try { state = JSON.parse(result.content[0].text); } catch (e) {}
      }
      if (!state) return null;
      board = state.board || board;
      currentTurn = state.turn || currentTurn;
      gameOver = state.gameOver || false;
      renderBoard();
      if (state.winner === 'draw') {
        updateStatus("It's a draw!");
      } else if (state.winner) {
        updateStatus(state.winner + ' wins!');
      } else {
        updateStatus(currentTurn === 'X' ? "Your turn (X)" : "Model's turn (O)");
      }
      return state;
    });
  }

  function newGame() {
    clearInterval(pollTimer);
    MCPApp.callTool('new_game', {}).then(function() {
      board = ['','','','','','','','',''];
      currentTurn = 'X';
      gameOver = false;
      renderBoard();
      updateStatus("X's turn — click a cell to play!");
      MCPApp.sendToolListChanged();
    });
  }

  // --- App-provided tools (host/model can call these) ---

  MCPApp.registerTool('make_move', {
    description: 'Place a piece on the tic-tac-toe board. The model plays as O.',
    inputSchema: {
      type: 'object',
      properties: {
        position: { type: 'number', description: 'Board position 0-8 (top-left=0, bottom-right=8)' }
      },
      required: ['position']
    }
  }, function(args) {
    // Delegate to the server so the app and server share one board.
    return MCPApp.callTool('server_move', { position: args.position }).then(function(result) {
      syncFromServer();
      return result;
    });
  });

  MCPApp.registerTool('get_board', {
    description: 'Get the current tic-tac-toe board state. Returns a 3x3 grid.',
  }, function() {
    var visual = '';
    for (var r = 0; r < 3; r++) {
      var row = [];
      for (var c = 0; c < 3; c++) {
        var v = board[r*3+c];
        row.push(v || (r*3+c));
      }
      visual += row.join(' | ') + '\n';
      if (r < 2) visual += '---------\n';
    }
    var state = {
      board: board,
      turn: currentTurn,
      gameOver: gameOver,
      visual: visual
    };
    return { content: [{ type: 'text', text: JSON.stringify(state, null, 2) }] };
  });

  MCPApp.on('connected', function() {
    syncFromServer();
  });

  MCPApp.on('toolresult', function(data) {
    syncFromServer();
  });

  renderBoard();
  updateStatus('Connecting...');
</script>
</body>
</html>
